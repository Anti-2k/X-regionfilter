# Copy to wrangler.toml (git-ignored) and fill in database_id from
# `wrangler d1 create regionfilter`.
name = "regionfilter-sync"
main = "src/worker.js"
compatibility_date = "2026-01-01"
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "regionfilter"
database_id = "00000000-0000-0000-0000-000000000000"
